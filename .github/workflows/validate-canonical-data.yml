name: Validate canonical data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate-canonical-data.mjs"
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate-canonical-data.mjs"

concurrency:
  group: ufs-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/validate-canonical-data.mjs
