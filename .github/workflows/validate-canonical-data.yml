name: Validate canonical data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate-canonical-data.mjs"
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate-canonical-data.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-canonical-data.mjs
